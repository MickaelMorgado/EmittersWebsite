[package]
name = "ps3-visualizer"
version = "0.1.0"
description = "PS3 Controller Realtime Particle Visualizer"
authors = ["Mickael"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "ps3_visualizer_lib"
path = "src/lib.rs"

[[bin]]
name = "ps3-visualizer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }

[features]
# By default Tauri runs in strict mode where all net requests are blocked.
# Determine domains/URLs the webview is allowed to access here.
# SECURITY NOTE: you must carefully review and specify only the `cmd`
# list below to prevent command injection security vulnerabilities.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
